[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uwb-auth"
version = "0.1.0"
description = "Condition-disjoint UWB recording verification with leakage-resistant evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<2.5",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uwb_auth"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
